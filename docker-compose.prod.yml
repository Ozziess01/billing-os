# production-стек: образы собираются из репозитория, кода на bind mount нет.
#   cp .env.prod.example .env.prod   (заполнить)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml -p billingos-prod up -d --build
x-php: &php
  image: billingos/app:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
  env_file: .env.prod
  environment: &env
    APP_ENV: production
    DB_HOST: postgres
    REDIS_HOST: redis
    REVERB_HOST: websocket
    LOG_CHANNEL: stderr
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    restart: always
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
      websocket:
        condition: service_started
    restart: always
    logging: *logging

  app:
    <<: *php
    environment:
      <<: *env
      CONTAINER_ROLE: app
    volumes:
      - app_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null && php artisan migrate:status --no-interaction >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  worker:
    <<: *php
    environment:
      <<: *env
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  websocket:
    <<: *php
    environment:
      <<: *env
      CONTAINER_ROLE: websocket
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: billingos/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_HOST: ${NEXT_PUBLIC_WS_HOST}
        NEXT_PUBLIC_WS_PORT: ${NEXT_PUBLIC_WS_PORT:-443}
        NEXT_PUBLIC_WS_TLS: ${NEXT_PUBLIC_WS_TLS:-true}
        NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: always
    logging: *logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-billingos}
      POSTGRES_USER: ${DB_USERNAME:-billingos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-billingos} -d ${DB_DATABASE:-billingos}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  app_storage:

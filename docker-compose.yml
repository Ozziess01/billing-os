x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - ./docs:/var/www/docs:ro
  # только адреса сервисов; всё остальное Laravel читает из backend/.env,
  # иначе переменные процесса перекрывают настройки тестов в phpunit.xml
  environment: &env
    DB_HOST: postgres
    REDIS_HOST: redis
    REVERB_HOST: websocket
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      <<: *env
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null && php artisan migrate:status --no-interaction >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s

  worker:
    <<: *php
    environment:
      <<: *env
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  websocket:
    <<: *php
    environment:
      <<: *env
      CONTAINER_ROLE: websocket
    ports:
      - "${WS_PORT:-8082}:8080"
    depends_on:
      app:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_started
      websocket:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${HTTP_PORT:-8090}/api/v1
      NEXT_PUBLIC_WS_HOST: localhost
      NEXT_PUBLIC_WS_PORT: "${HTTP_PORT:-8090}"
      NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY:-billingos-key}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8027}:8025"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billingos
      POSTGRES_USER: billingos
      POSTGRES_PASSWORD: billingos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billingos -d billingos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  frontend_modules:
  backend_vendor:

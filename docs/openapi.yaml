        subscription_item_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        customer_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }

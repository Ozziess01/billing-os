openapi: 3.1.0
info:
  title: BillingOS API
  version: 1.0.0
  description: |
    Self-hosted биллинг для SaaS: клиенты, продукты и цены, подписки, инвойсы, платежи, возвраты,
    usage-based billing, купоны, леджер. Все суммы - целые минорные единицы валюты.

    Аутентификация: `Authorization: Bearer <token>` - токен пользователя (Sanctum) или ключ организации `bos_live_…`.
    Контекст организации для пользователя - заголовок `X-Organization` (id или slug), для ключа - организация ключа.
    Финансовые POST принимают `Idempotency-Key`. Клиентский портал ходит с токеном `bps_…`.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: Auth
  - name: Organizations
  - name: Dashboard
  - name: Customers
  - name: Products
  - name: Subscriptions
  - name: Usage
  - name: Coupons
  - name: Invoices
  - name: Payments
  - name: Ledger
  - name: Webhooks
  - name: Notifications
  - name: API keys
  - name: Activity
  - name: Portal
paths:
  /auth/register:
    post:
      summary: "Регистрация"
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, email, password, password_confirmation], properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 8 }, password_confirmation: { type: string }, organization: { type: string, description: "Название первой организации" } } }
      responses:
        '201': { description: "Токен и организации", content: { application/json: { schema: { type: object, properties: { token: { type: string }, user: { $ref: '#/components/schemas/User' }, organizations: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      summary: "Вход"
      tags: [Auth]
      description: "5 неудачных попыток на почту+ip - пауза 5 минут."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200': { description: "Токен и организации" }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/logout:
    post:
      summary: "Отозвать текущий токен"
      tags: [Auth]
      responses:
        '204': { description: "Готово" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      summary: "Текущий пользователь и его организации"
      tags: [Auth]
      responses:
        '200': { description: "OK" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organizations:
    get:
      summary: "Мои организации"
      tags: [Organizations]
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Organization' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: "Создать организацию"
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, default_currency: { type: string } } }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Organization' } } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /organizations/{organization}:
    get:
      summary: "Организация"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Organization' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: "Переименовать / сменить валюту (admin+)"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, default_currency: { type: string } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Organization' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /organizations/{organization}/members:
    get:
      summary: "Участники"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Member' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: "Добавить участника по почте (admin+)"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, role], properties: { email: { type: string }, role: { type: string, enum: [admin, developer, viewer] } } }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Member' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /organizations/{organization}/members/{member}:
    patch:
      summary: "Сменить роль (admin+)"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
        - { name: member, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { type: string, enum: [admin, developer, viewer] } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Member' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: "Удалить участника (admin+) или выйти самому"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
        - { name: member, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: "Готово" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /organizations/{organization}/transfer:
    post:
      summary: "Передать владение (owner)"
      tags: [Organizations]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: integer } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Organization' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /dashboard:
    get:
      summary: "Сводка: клиенты, подписки по статусам, MRR по валютам"
      tags: [Dashboard]
      parameters:
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customers:
    get:
      summary: "Клиенты"
      tags: [Customers]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "поиск по имени, почте, external_id" }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Customer' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: "Создать клиента (developer+)"
      tags: [Customers]
      parameters:
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /customers/{customer}:
    get:
      summary: "Клиент с подписками"
      tags: [Customers]
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: "Изменить клиента (developer+)"
      tags: [Customers]
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    put:
      summary: "Изменить клиента (developer+)"
      tags: [Customers]
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: "Удалить клиента без подписок (admin+)"
      tags: [Customers]
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '204': { description: "Готово" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /customers/{customer}/portal-session:
    post:
      summary: "Ссылка в клиентский портал (developer+)"
      tags: [Customers]
      description: "Сессия живёт сутки, хранится только хеш токена."
      parameters:
        - { name: customer, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '201': { description: 'Ссылка и токен показываются один раз', content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { url: { type: string }, token: { type: string }, expires_at: { type: string, format: date-time } } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products:
    get:
      summary: "Продукты с ценами"
      tags: [Products]
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Product' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: "Создать продукт (developer+)"
      tags: [Products]
      parameters:
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, description: { type: string, nullable: true }, active: { type: boolean }, metadata: { $ref: '#/components/schemas/Metadata' } } }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /products/{product}:
    get:
      summary: "Продукт"
      tags: [Products]
      parameters:
        - { name: product, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: "Изменить продукт (developer+)"
      tags: [Products]
      parameters:
        - { name: product, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, description: { type: string, nullable: true }, active: { type: boolean }, metadata: { $ref: '#/components/schemas/Metadata' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    put:
      summary: "Изменить продукт (developer+)"
      tags: [Products]
      parameters:
        - { name: product, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, description: { type: string, nullable: true }, active: { type: boolean } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: "Удалить продукт без цен (admin+)"
      tags: [Products]
      parameters:
        - { name: product, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '204': { description: "Готово" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /prices:
    get:
      summary: "Цены"
      tags: [Products]
      parameters:
        - { name: product_id, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Price' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: "Создать цену (developer+)"
      tags: [Products]
      description: "Сумма, валюта и интервал после создания не меняются - создайте новую цену."
      parameters:
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceInput' }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Price' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /prices/{price}:
    get:
      summary: "Цена"
      tags: [Products]
      parameters:
        - { name: price, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Price' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: "Название и активность цены (developer+)"
      tags: [Products]
      parameters:
        - { name: price, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { nickname: { type: string, nullable: true }, active: { type: boolean }, metadata: { $ref: '#/components/schemas/Metadata' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Price' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    put:
      summary: "Название и активность цены (developer+)"
      tags: [Products]
      parameters:
        - { name: price, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { nickname: { type: string, nullable: true }, active: { type: boolean } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Price' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      summary: "Удалить неиспользуемую цену (admin+)"
      tags: [Products]
      parameters:
        - { name: price, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '204': { description: "Готово" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /subscriptions:
    get:
      summary: "Подписки"
      tags: [Subscriptions]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [trialing, active, past_due, canceled, incomplete] } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Subscription' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: "Оформить подписку (developer+)"
      tags: [Subscriptions]
      description: "Без триала сразу выставляется инвойс за первый период и, если у клиента есть default_payment_method, списывается: успех - active, отказ - incomplete."
      parameters:
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /subscriptions/{subscription}:
    get:
      summary: "Подписка"
      tags: [Subscriptions]
      parameters:
        - { name: subscription, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /subscriptions/{subscription}/cancel:
    post:
      summary: "Отменить: в конце периода (по умолчанию) или сейчас"
      tags: [Subscriptions]
      parameters:
        - { name: subscription, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { at_period_end: { type: boolean, default: true } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /subscriptions/{subscription}/resume:
    post:
      summary: "Снять отмену в конце периода"
      tags: [Subscriptions]
      parameters:
        - { name: subscription, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

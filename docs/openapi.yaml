        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } } } } } } }
    patch:
      summary: "Обновить каналы"
      tags: [Notifications]
      parameters:
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [preferences], properties: { preferences: { type: array, items: { type: object, required: [event, in_app, mail], properties: { event: { type: string }, in_app: { type: boolean }, mail: { type: boolean } } } } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/NotificationPreference' } } } } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /api-keys:
    get:
      summary: "Ключи организации (admin+)"
      tags: [API keys]
      parameters:
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ApiKey' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: "Выпустить ключ (admin+); plain_key показывается один раз"
      tags: [API keys]
      parameters:
        - { $ref: '#/components/parameters/organization' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, expires_at: { type: string, format: date-time, nullable: true } } }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ApiKey' }, plain_key: { type: string, example: bos_live_… } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /api-keys/{key}:
    delete:
      summary: "Отозвать ключ (admin+)"
      tags: [API keys]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '204': { description: "Готово" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /activity:
    get:
      summary: "Журнал действий (admin+), append-only"
      tags: [Activity]
      parameters:
        - { name: action, in: query, schema: { type: string }, description: "префикс, например payment" }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/perPage' }
        - { $ref: '#/components/parameters/organization' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ActivityLog' } }, meta: { $ref: '#/components/schemas/Meta' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /portal/session:
    get:
      summary: "Клиент, организация и срок сессии"
      tags: [Portal]
      security: [{ portal: [] }]
      responses:
        '200': { description: "OK" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/billing:
    patch:
      summary: "Реквизиты и способ оплаты"
      tags: [Portal]
      security: [{ portal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, email: { type: string, nullable: true }, default_payment_method: { type: string, nullable: true } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
  /portal/subscriptions:
    get:
      summary: "Подписки клиента"
      tags: [Portal]
      security: [{ portal: [] }]
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/subscriptions/{id}/cancel:
    post:
      summary: "Отменить подписку"
      tags: [Portal]
      security: [{ portal: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { at_period_end: { type: boolean, default: true } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Subscription' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /portal/invoices:
    get:
      summary: "Инвойсы клиента (кроме черновиков)"
      tags: [Portal]
      security: [{ portal: [] }]
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Invoice' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/invoices/{id}:
    get:
      summary: "Инвойс"
      tags: [Portal]
      security: [{ portal: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Invoice' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/invoices/{id}/export:
    get:
      summary: "Выгрузка инвойса"
      tags: [Portal]
      security: [{ portal: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200': { description: "Файл JSON или CSV (Content-Disposition attachment)" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/invoices/{id}/pay:
    post:
      summary: "Оплатить инвойс"
      tags: [Portal]
      security: [{ portal: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [payment_method], properties: { payment_method: { type: string } } }
      responses:
        '201': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Payment' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /portal/payments:
    get:
      summary: "История платежей клиента"
      tags: [Portal]
      security: [{ portal: [] }]
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Payment' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Токен пользователя (Sanctum) или ключ организации `bos_live_…`. Для ключа организация определяется автоматически, права - developer."
    portal:
      type: http
      scheme: bearer
      description: Токен сессии клиентского портала `bps_…` из ссылки, выданной `POST /customers/{id}/portal-session`.
  parameters:
    organization:
      name: X-Organization
      in: header
      required: false
      description: id или slug организации. Не нужен, если пользователь состоит ровно в одной, и игнорируется для API-ключа.
      schema: { type: string }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Ключ идемпотентности (до 120 символов). Повтор того же запроса отдаёт сохранённый ответ с `Idempotent-Replayed: true`; тот же ключ с другим телом - 409."
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    perPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
  responses:
    Unauthorized: { description: "Нет или недействителен токен" }
    Forbidden: { description: "Недостаточно прав в организации" }
    NotFound: { description: "Ресурс не найден или принадлежит другой организации" }
    Validation:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Conflict:
      description: Нарушение доменного правила (недопустимый переход состояния, второй платёж в полёте, повтор Idempotency-Key с другим телом)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties: { message: { type: string } }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    Money:
      type: object
      description: Сумма в минорных единицах валюты. Никаких float.
      properties:
        amount: { type: integer, example: 1999 }
        currency: { type: string, example: EUR }
        formatted: { type: string, example: 19.99 EUR }
    Metadata:
      type: object
      description: До 50 ключей, плоские скалярные значения
      additionalProperties: { oneOf: [{ type: string }, { type: number }, { type: boolean }, { type: 'null' }] }
    Meta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    Organization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        default_currency: { type: string }
        owner_id: { type: integer }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        members_count: { type: integer }
        created_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        joined_at: { type: string, format: date-time }
    Customer:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        external_id: { type: string, nullable: true }
        name: { type: string }
        email: { type: string, nullable: true }
        description: { type: string, nullable: true }
        default_payment_method: { type: string, nullable: true, description: "Платёжный метод у провайдера для автосписания" }
        metadata: { $ref: '#/components/schemas/Metadata' }
        subscriptions_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        email: { type: string, nullable: true }
        external_id: { type: string, nullable: true, maxLength: 120 }
        description: { type: string, nullable: true }
        default_payment_method: { type: string, nullable: true }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Product:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        name: { type: string }
        description: { type: string, nullable: true }
        active: { type: boolean }
        metadata: { $ref: '#/components/schemas/Metadata' }
        prices: { type: array, items: { $ref: '#/components/schemas/Price' } }
        created_at: { type: string, format: date-time }
    Price:
      type: object
      description: Сумма, валюта и интервал после создания неизменяемы.
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        product_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        nickname: { type: string, nullable: true }
        currency: { type: string }
        unit_amount: { type: integer, description: "Минорные единицы за период × количество (licensed)" }
        unit_amount_formatted: { type: string }
        usage_type: { type: string, enum: [licensed, metered] }
        unit_amount_decimal: { type: string, nullable: true, description: 'Цена за единицу использования в минорных единицах с дробью (metered): "0.1" = €0.001' }
        billing_interval: { type: string, enum: [day, week, month, year] }
        interval_count: { type: integer }
        active: { type: boolean }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
    PriceInput:
      type: object
      required: [product_id, currency, billing_interval]
      properties:
        product_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        nickname: { type: string, nullable: true }
        currency: { type: string, example: EUR }
        unit_amount: { type: integer, minimum: 0, description: "Обязателен для licensed" }
        usage_type: { type: string, enum: [licensed, metered], default: licensed }
        unit_amount_decimal: { type: string, description: "Обязателен для metered" }
        billing_interval: { type: string, enum: [day, week, month, year] }
        interval_count: { type: integer, minimum: 1, maximum: 365, default: 1 }
        active: { type: boolean }
        metadata: { $ref: '#/components/schemas/Metadata' }
    SubscriptionItem:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        price_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        price: { $ref: '#/components/schemas/Price' }
        quantity: { type: integer }
        usage_type: { type: string, enum: [licensed, metered] }
        amount: { $ref: '#/components/schemas/Money' }
    Subscription:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        customer_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        customer: { $ref: '#/components/schemas/Customer' }
        status: { type: string, enum: [trialing, active, past_due, canceled, incomplete] }
        currency: { type: string }
        period_amount: { $ref: '#/components/schemas/Money' }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        cancel_at_period_end: { type: boolean }
        canceled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string, nullable: true, enum: [requested, period_end, payment_failed, portal, null] }
        ended_at: { type: string, format: date-time, nullable: true }
        coupon: { $ref: '#/components/schemas/Coupon' }
        items: { type: array, items: { $ref: '#/components/schemas/SubscriptionItem' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
    SubscriptionInput:
      type: object
      required: [customer_id, items]
      properties:
        customer_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [price_id]
            properties:
              price_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
              quantity: { type: integer, minimum: 1, default: 1 }
        trial_days: { type: integer, minimum: 0, maximum: 365, default: 0 }
        starts_at: { type: string, format: date-time }
        coupon_code: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
    InvoiceItem:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        price_id: { type: string, nullable: true }
        description: { type: string }
        quantity: { type: integer }
        unit_amount: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
    InvoiceItemInput:
      type: object
      description: Либо price_id (сумма из цены), либо description + unit_amount
      properties:
        price_id: { type: string, nullable: true }
        description: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1, default: 1 }
        unit_amount: { type: integer, minimum: 0, nullable: true }
    Invoice:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        number: { type: string, nullable: true, example: INV-000042, description: "Выдаётся при финализации" }
        status: { type: string, enum: [draft, open, paid, void, uncollectible] }
        customer_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        customer: { $ref: '#/components/schemas/Customer' }
        subscription_id: { type: string, nullable: true }
        currency: { type: string }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        amount_paid: { $ref: '#/components/schemas/Money' }
        amount_due: { $ref: '#/components/schemas/Money' }
        description: { type: string, nullable: true }
        coupon_id: { type: string, nullable: true }
        auto_collect: { type: boolean }
        collection_attempts: { type: integer }
        next_payment_attempt_at: { type: string, format: date-time, nullable: true }
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        finalized_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        voided_at: { type: string, format: date-time, nullable: true }
        uncollectible_at: { type: string, format: date-time, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceItem' } }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
    Payment:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        invoice_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        invoice: { $ref: '#/components/schemas/Invoice' }
        customer_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        attempt_number: { type: integer }
        status: { type: string, enum: [pending, processing, succeeded, failed, canceled] }
        amount: { $ref: '#/components/schemas/Money' }
        amount_refunded: { $ref: '#/components/schemas/Money' }
        refundable_amount: { $ref: '#/components/schemas/Money' }
        provider: { type: string, example: fake }
        provider_payment_id: { type: string, nullable: true }
        payment_method: { type: string }
        failure_code: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }
        next_action: { type: object, nullable: true, description: 'Для requires_action: { type: confirm, provider_payment_id }' }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' } }
        succeeded_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        canceled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Refund:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        payment_id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        status: { type: string, enum: [pending, succeeded, failed] }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, nullable: true }
        provider_refund_id: { type: string, nullable: true }
        failure_message: { type: string, nullable: true }
        succeeded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Coupon:
      type: object
      properties:
        id: { type: string, minLength: 26, maxLength: 26, example: 01j9x8b6d1v3y7z2q4w5e6r7t8 }
        code: { type: string, example: SAVE20 }
        name: { type: string }
        type: { type: string, enum: [percent, fixed] }
        percent_off: { type: integer, nullable: true }
        amount_off: { $ref: '#/components/schemas/Money' }
        currency: { type: string, nullable: true }
        duration: { type: string, enum: [once, forever] }
        redeem_by: { type: string, format: date-time, nullable: true }
        max_redemptions: { type: integer, nullable: true }
        times_redeemed: { type: integer }
        customer_id: { type: string, nullable: true }
